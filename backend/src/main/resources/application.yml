server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      # Luôn trả "application/json;charset=UTF-8": package http của Dart đọc Latin-1 nếu thiếu charset
      charset: UTF-8
      force-response: true

spring:
  application:
    name: flash-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:flash_db}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:flash}
    password: ${DB_PASSWORD:flash}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # Gửi OTP qua email: đặt SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
  # Không đặt thì OTP chỉ được in ra log (dev).

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-change-me-in-production-0123456789}
    issuer: flash-backend
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  auth:
    otp-ttl: PT10M
    otp-max-attempts: 5
    otp-resend-interval: PT60S
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  google:
    # OAuth client id của app (Android/iOS/Web), cách nhau bằng dấu phẩy
    client-ids: ${GOOGLE_CLIENT_IDS:}
  sync:
    rate-limit-per-minute: ${SYNC_RATE_LIMIT_PER_MINUTE:30}
    cleanup-cron: "0 30 3 * * *"   # dọn sync_operations > 30 ngày, 03:30 UTC mỗi ngày
  mail:
    from: ${MAIL_FROM:no-reply@flash.local}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.flash: DEBUG
